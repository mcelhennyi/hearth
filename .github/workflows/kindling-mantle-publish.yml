# Validate @kindling/mantle packaging when tag kindling-mantle-vX.Y.Z is pushed (T-FR-0006-15).
name: kindling-mantle package

on:
  push:
    tags:
      - "kindling-mantle-v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mantle
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/kindling-mantle-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag kindling-mantle-v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "Validating private @kindling/mantle@${PKG} package artifact"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build and test
        run: pnpm run test

      - name: Package dry-run
        run: npm pack --dry-run --ignore-scripts
