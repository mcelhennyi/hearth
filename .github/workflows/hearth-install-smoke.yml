# T-FR-0003-12 — install + hearth smoke on amd64 and arm64 GitHub-hosted runners.
name: Hearth install smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hearth-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            label: amd64
          - runs_on: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install smoke (${{ matrix.label }})
        run: ./scripts/ci/hearth-install-smoke.sh
