[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-ops"
version = "0.0.0"
description = "Hearth Docker profile install layout and operator CLI (FR-0003)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hearth = "hearth_cli.cli:main"
kindling = "kindling_cli.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic>=2",
    "pywebpush",
    "argon2-cffi>=23",
    "itsdangerous>=2",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["deploy/hearth-install", "deploy/hearth-cli", "deploy/kindling-contract", "deploy/hearth-plugin-cli", "kindling/cli"]

[tool.setuptools.package-data]
hearth_install = ["templates/*"]
hearth_kindling_contract = ["templates/plugin-python/*", "templates/plugin-python/scripts/*", "templates/plugin-python/package/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires HEARTH_INTEGRATION=1 and a running Compose stack",
]
pythonpath = [
    "deploy/hearth-install",
    "deploy/hearth-cli",
    "deploy/kindling-contract",
    "deploy/hearth-plugin-cli",
    "apps/hub/api",
    "kindling/cli",
]

[tool.ruff]
line-length = 100
src = [
    "deploy/hearth-install/hearth_install",
    "deploy/hearth-cli/hearth_cli",
    "deploy/kindling-contract/hearth_kindling_contract",
    "deploy/hearth-plugin-cli/hearth_plugin_cli",
    "kindling/cli/kindling_cli",
    "apps/hub/api",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
