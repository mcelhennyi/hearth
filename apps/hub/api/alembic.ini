[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DB URL is set via env at runtime; alembic/env.py reads HEARTH_DB_URL or
# falls back to the default SQLite path.
sqlalchemy.url = sqlite:///var/hearth/hearth.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
