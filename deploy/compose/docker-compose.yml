services:
  web:
    image: node:20-alpine
    container_name: hearth-web-tooling
    working_dir: /workspace/apps/hub/web
    command: sh -lc "sleep infinity"
    volumes:
      - ../../:/workspace
    profiles:
      - tooling

  hub:
    build:
      context: ../../apps/hub/api
    container_name: hearth-hub-api
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8200 --reload
    volumes:
      - ../../apps/hub/api:/app
      - ../../:/workspace
    environment:
      - PYTHONUNBUFFERED=1

  caddy:
    image: caddy:2.8-alpine
    container_name: hearth-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../static:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hub

  ca-export:
    image: caddy:2.8-alpine
    container_name: hearth-ca-export
    restart: "no"
    depends_on:
      - caddy
    ports:
      - "8080:8080"
    environment:
      - CA_EXPORT_SECONDS=600
    command: >-
      sh -eu -c '
      CERT=/data/caddy/pki/authorities/local/root.crt;
      while [ ! -s "$$CERT" ]; do sleep 1; done;
      cp "$$CERT" /srv/ca.crt;
      timeout "$${CA_EXPORT_SECONDS}" caddy file-server --root /srv --listen :8080
      '
    volumes:
      - caddy_data:/data:ro
      - ca_export_data:/srv

volumes:
  caddy_data:
  caddy_config:
  ca_export_data:
