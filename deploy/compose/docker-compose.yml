# HTTP quick stack: `docker compose up -d caddy-http` or `./develop up-quick`
# Docs: `./develop docs` (squidfunk/mkdocs-material:9.7.1, profile `docs`; host HEARTH_DOCS_PORT → :8000)
services:
  docs:
    profiles: ["docs"]
    # Same MkDocs Material build as Loom’s locked 9.7.1 stack; official image uses WORKDIR /docs.
    image: squidfunk/mkdocs-material:9.7.1
    container_name: hearth-docs
    restart: unless-stopped
    working_dir: /docs
    ports:
      - "${HEARTH_DOCS_PORT:-5081}:8000"
    environment:
      # Bind-mount file events are unreliable on some Docker hosts; polling keeps live reload working.
      - WATCHDOG_FORCE_POLLING=true
    volumes:
      - ../..:/docs:cached
    command:
      - serve
      - --dev-addr=0.0.0.0:8000
      - --watch
      - docs
      - --watch
      - mkdocs.yml
      - --watch
      - docs/stylesheets

  caddy-http:
    profiles: ["http-quick"]
    image: caddy:2.8-alpine
    container_name: hearth-caddy-http
    restart: unless-stopped
    ports:
      - "5080:80"
    volumes:
      - ../caddy/Caddyfile.dev.http:/etc/caddy/Caddyfile:ro
      - ../static:/srv:ro

  caddy:
    image: caddy:2.8-alpine
    container_name: hearth-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../static:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  ca-export:
    image: caddy:2.8-alpine
    container_name: hearth-ca-export
    restart: "no"
    depends_on:
      - caddy
    ports:
      - "8080:8080"
    environment:
      - CA_EXPORT_SECONDS=600
    command: >-
      sh -eu -c '
      CERT=/data/caddy/pki/authorities/local/root.crt;
      while [ ! -s "$$CERT" ]; do sleep 1; done;
      cp "$$CERT" /srv/ca.crt;
      timeout "$${CA_EXPORT_SECONDS}" caddy file-server --root /srv --listen :8080
      '
    volumes:
      - caddy_data:/data:ro
      - ca_export_data:/srv

  hearth-test:
    profiles: ["test"]
    image: python:3.12-slim-bookworm
    container_name: hearth-pytest
    working_dir: /work
    volumes:
      - ../..:/work:cached
      - ./hearth-test-entry.sh:/entry.sh:ro
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    entrypoint: ["/bin/sh", "/entry.sh"]
    command: ["tests"]

volumes:
  caddy_data:
  caddy_config:
  ca_export_data:
