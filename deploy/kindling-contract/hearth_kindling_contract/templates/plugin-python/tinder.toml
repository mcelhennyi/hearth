[plugin]
slug = "{{ plugin_slug }}"
name = "{{ plugin_name }}"
version = "0.1.0"
hearth_min = "0.1.0"
description = "Generated Hearth plugin template."

[entrypoint]
backend = { kind = "python", module = "{{ python_package }}.app:create_app", port_env = "HEARTH_PLUGIN_PORT" }
ui = { kind = "static", path = "web/dist" }

[permissions]
spark_call = []
spark_publish = ["{{ plugin_slug }}.*"]
spark_subscribe = []
fs_paths = ["plugins/{{ plugin_slug }}"]
network = "loopback"

[backup]
include = ["plugins/{{ plugin_slug }}/"]
exclude = ["plugins/{{ plugin_slug }}/cache/"]
